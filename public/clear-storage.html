<!DOCTYPE html>
<html>
<head>
    <title>Clear Storage - RentMatch</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        h1 { color: #d97757; }
        .info { background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 20px 0; }
        a { color: #d97757; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧹 Storage Cleared!</h1>
    <div class="info">
        <p><strong>Cleared items:</strong></p>
        <pre id="clearedItems"></pre>
    </div>
    <p><a href="index.html">← Go back to home</a></p>
    <script>
        // Show what was in storage before clearing
        const items = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            items[key] = localStorage.getItem(key);
        }
        
        document.getElementById('clearedItems').textContent = 
            Object.keys(items).length > 0 
                ? JSON.stringify(items, null, 2) 
                : '(localStorage was already empty)';
        
        // Clear everything
        localStorage.clear();
        sessionStorage.clear();
        console.log('LocalStorage and SessionStorage cleared');
        
        // Force reload after a delay
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    </script>
</body>
</html>
