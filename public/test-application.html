<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Application - RentMatch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, select {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 200px;
        }
        button {
            background: #d97757;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #c86647;
        }
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .apartment-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .apartment-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .apartment-info {
            padding: 15px;
        }
        .apartment-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .apartment-rent {
            color: #d97757;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="test-form">
        <h1>Test Application Submission</h1>
        <form id="testForm">
            <div>
                <label>First Name:</label><br>
                <input type="text" name="firstName" value="Test" required>
            </div>
            <div>
                <label>Last Name:</label><br>
                <input type="text" name="lastName" value="User" required>
            </div>
            <div>
                <label>Email:</label><br>
                <input type="email" name="email" value="test@example.com" required>
            </div>
            <div>
                <label>Monthly Income:</label><br>
                <input type="number" name="monthlyIncome" value="5000" required>
            </div>
            <div>
                <label>Credit Score:</label><br>
                <input type="number" name="creditScore" value="700" required>
            </div>
            <div>
                <label>Pets:</label><br>
                <select name="pets">
                    <option value="no">No</option>
                    <option value="dog">Dog</option>
                    <option value="cat">Cat</option>
                </select>
            </div>
            <div>
                <label>Evictions:</label><br>
                <select name="evictions">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>
            <div>
                <label>Bankruptcy:</label><br>
                <select name="bankruptcy">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>
            <div>
                <label>Criminal Record:</label><br>
                <select name="criminalRecord">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>
            <div>
                <label>Smoking:</label><br>
                <select name="smoking">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>
            <br>
            <button type="submit">Find Matches</button>
        </form>
        <div id="status"></div>
    </div>

    <div id="results" class="results"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Finding matches...';
            
            try {
                const response = await fetch('http://localhost:5000/api/submit-application', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusDiv.innerHTML = `<strong>Found ${result.count} matches!</strong>`;
                    
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = result.matches.map(apt => `
                        <div class="apartment-card">
                            <img src="${apt.image}" alt="${apt.name}" onerror="this.style.background='#ddd'; this.alt='Image failed to load'">
                            <div class="apartment-info">
                                <div class="apartment-name">${apt.name}</div>
                                <div class="apartment-rent">$${apt.rent}/month</div>
                                <div>${apt.bedrooms} bed | ${apt.bathrooms} bath</div>
                                <div>${apt.city}, ${apt.state}</div>
                                <div><small>Match Score: ${apt.match_score}</small></div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    statusDiv.innerHTML = `<strong style="color: red;">Error: ${result.error}</strong>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<strong style="color: red;">Error: ${error.message}</strong>`;
            }
        });
    </script>
</body>
</html>
